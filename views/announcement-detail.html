<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><!-- ANNOUNCEMENT_TITLE --> - Announcement Details</title>
    <style>
        :root {
            --clr-green: #2ecc71;
            --clr-yellow: #f1c40f;
            --clr-black: #111111;
            --clr-blue: #3498db;
            --clr-white: #ffffff;
            --clr-bg: #f8f9fa;
            --clr-gray: #e9ecef;
            --clr-danger: #e74c3c;
            --clr-warning: #f39c12;
            --clr-purple: #9b59b6;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--clr-bg); 
            color: var(--clr-black); 
        }
        header { 
            background: var(--clr-black); 
            color: var(--clr-white); 
            padding: 1.5rem 0; 
            text-align: center; 
            border-bottom: 5px solid var(--clr-blue); 
        }
        header h2 { margin: 0; font-size: 2rem; }
        nav { 
            background: var(--clr-blue); 
            display: flex; 
            justify-content: center; 
            padding: 0.8rem; 
            flex-wrap: wrap;
        }
        nav a { 
            color: var(--clr-white); 
            text-decoration: none; 
            padding: 0.6rem 1.2rem; 
            margin: 0.2rem 0.4rem; 
            border-radius: 4px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        nav a:hover, nav a.active { 
            background: var(--clr-yellow); 
            color: var(--clr-black); 
        }
        .container { 
            max-width: 800px; 
            margin: 3rem auto; 
            padding: 0 1rem; 
        }
        .card {
            background: var(--clr-white);
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            padding: 2.5rem;
            border-top: 6px solid var(--clr-purple);
        }
        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 0.5rem;
        }
        .meta-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            color: #666;
            font-size: 0.95rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--clr-gray);
            margin: 1rem 0 1.5rem;
        }
        .content-box {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #2c3e50;
            background: #fafbfc;
            padding: 1.5rem;
            border-radius: 6px;
            border-left: 4px solid var(--clr-purple);
            margin-bottom: 2rem;
            white-space: pre-wrap;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        .btn {
            display: inline-block;
            padding: 0.65rem 1.4rem;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-back { background: #6c757d; color: white; }
        .btn-back:hover { background: #5a6268; }
        .btn-edit { background: var(--clr-warning); color: #111; }
        .btn-edit:hover { background: #e67e22; color: white; }
    </style>
</head>
<body>
    <header>
        <h2>Alumni Network</h2>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/about">About Us</a>
        <a href="/users">Alumni Directory</a>
        <a href="/announcements" class="active">Announcements</a>
        <a href="/api/swagger">API Docs</a>
    </nav>

    <div class="container">
        <div class="card">
            <span class="badge" style="background:#e8daf0; color:#6c3483;"><!-- ANNOUNCEMENT_CATEGORY --></span>
            <span class="badge" style="background:#fef9e7; color:#7d6608;"><!-- ANNOUNCEMENT_PRIORITY --></span>
            
            <h1 style="margin: 1rem 0 0.5rem; color: #2c3e50;"><!-- ANNOUNCEMENT_TITLE --></h1>

            <div class="meta-bar">
                <span>👤 <strong>Yayınlayan:</strong> <!-- ANNOUNCEMENT_AUTHOR --></span>
                <span>📅 <strong>Tarih:</strong> <!-- ANNOUNCEMENT_DATE --></span>
                <span>🆔 <strong>Duyuru ID:</strong> #<!-- ANNOUNCEMENT_ID --></span>
            </div>

            <div class="content-box">
<!-- ANNOUNCEMENT_CONTENT -->
            </div>

            <div class="actions">
                <a href="/announcements" class="btn btn-back">⬅️ Back to Announcements</a>
                <a href="/announcements/<!-- ANNOUNCEMENT_ID -->/edit" class="btn btn-edit">✏️ Edit Announcement</a>
            </div>
        </div>
    </div>
</body>
</html>
