<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found — Alumni Tracking System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ease-cream: #fffefc;
            --ease-white: #ffffff;
            --ease-keylime: #fef9e7;
            --ease-yellow-mist: #fef08a;
            --ease-yellow-core: #f1c40f;
            --ease-slate-hush: #b6ced5;
            --ease-blue-core: #3498db;
            --ease-black: #111111;
            --ease-graphite: #2b2b2b;
            --ease-muted: #555555;
            --ease-border: #111111;
            --ease-border-soft: rgba(17, 17, 17, 0.12);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius-card: 14px;
            --radius-pill: 999px;
            --radius-nav: 7px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; box-shadow: none !important; }
        body {
            font-family: var(--font-sans);
            background-color: var(--ease-cream);
            color: var(--ease-black);
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* ── Navigation ── */
        header {
            background-color: var(--ease-cream);
            border-bottom: 1px solid var(--ease-border-soft);
        }
        .nav-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-lockup {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--ease-black);
        }
        .logo-pill {
            background: var(--ease-black);
            color: var(--ease-cream);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }
        .logo-title {
            font-family: var(--font-serif);
            font-size: 21px;
            font-weight: 300;
            letter-spacing: -0.01em;
        }
        nav.nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        nav.nav-links a {
            color: var(--ease-black);
            text-decoration: none;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-nav);
            transition: background 0.15s ease;
        }
        nav.nav-links a:hover {
            background-color: var(--ease-keylime);
        }

        /* ── Error Container ── */
        .error-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }
        .error-panel {
            max-width: 620px;
            width: 100%;
            text-align: center;
        }
        .error-code {
            font-family: var(--font-serif);
            font-size: 120px;
            font-weight: 300;
            letter-spacing: -0.03em;
            line-height: 1;
            color: var(--ease-black);
            margin-bottom: 8px;
        }
        .error-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
            color: var(--ease-muted);
            margin-bottom: 28px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .error-label::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--ease-yellow-core);
        }
        .error-title {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 300;
            letter-spacing: -0.015em;
            margin-bottom: 16px;
        }
        .error-reason {
            background-color: var(--ease-keylime);
            border: 1px solid var(--ease-border-soft);
            border-radius: var(--radius-card);
            padding: 16px 20px;
            font-size: 13.5px;
            color: var(--ease-graphite);
            line-height: 1.6;
            text-align: left;
            margin-bottom: 24px;
        }
        .error-url {
            font-size: 12px;
            color: var(--ease-muted);
            margin-bottom: 32px;
            word-break: break-all;
        }
        .error-url code {
            background-color: var(--ease-white);
            border: 1px solid var(--ease-border-soft);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
        }
        .btn-home {
            background-color: var(--ease-black);
            color: var(--ease-cream);
            border: 1px solid var(--ease-black);
            padding: 12px 28px;
            border-radius: var(--radius-card);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease;
        }
        .btn-home:hover { background-color: var(--ease-graphite); }
        .btn-outline {
            background-color: var(--ease-white);
            color: var(--ease-black);
            border: 1px solid var(--ease-border);
            padding: 12px 24px;
            border-radius: var(--radius-card);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-left: 12px;
            transition: background 0.2s ease;
        }
        .btn-outline:hover { background-color: var(--ease-keylime); }

        /* ── Footer ── */
        footer {
            background-color: var(--ease-black);
            color: #999;
            padding: 24px;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="logo-lockup">
                <span class="logo-pill">ATS</span>
                <span class="logo-title">Alumni Tracking System</span>
            </a>
            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/about">About Us</a>
                <a href="/users">Alumni Directory</a>
                <a href="/announcements">Announcements</a>
                <a href="/jobs">Careers</a>
                <a href="/mentorship">Mentorship</a>
                <a href="/api/swagger">API Docs</a>
            </nav>
        </div>
    </header>

    <div class="error-stage">
        <div class="error-panel">
            <div class="error-code">404</div>
            <div class="error-label">Resource Not Found</div>
            <h1 class="error-title">The page you are looking for does not exist.</h1>
            <div class="error-reason">
                <!-- ERROR_REASON -->
            </div>
            <div class="error-url">
                Requested path: <code><!-- REQUESTED_URL --></code>
            </div>
            <a href="/" class="btn-home">← Return Home</a>
            <a href="/users" class="btn-outline">Alumni Directory</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Alumni Tracking System. Ease Health Edition.
    </footer>
</body>
</html>
