<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnus Profile - Alumni Network</title>
    <style>
        :root {
            --clr-green: #2ecc71;
            --clr-yellow: #f1c40f;
            --clr-black: #111111;
            --clr-blue: #3498db;
            --clr-white: #ffffff;
            --clr-bg: #f8f9fa;
            --clr-danger: #e74c3c;
            --clr-warning: #f39c12;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--clr-bg); 
            color: var(--clr-black); 
        }
        header { 
            background: var(--clr-black); 
            color: var(--clr-white); 
            padding: 1.5rem 0; 
            text-align: center; 
            border-bottom: 5px solid var(--clr-blue); 
        }
        header h2 { margin: 0; font-size: 2rem; }
        nav { 
            background: var(--clr-blue); 
            display: flex; 
            justify-content: center; 
            padding: 0.8rem; 
        }
        nav a { 
            color: var(--clr-white); 
            text-decoration: none; 
            padding: 0.6rem 1.2rem; 
            margin: 0 0.5rem; 
            border-radius: 4px; 
            font-weight: bold; 
            transition: 0.3s; 
        }
        nav a:hover, nav a.active { 
            background: var(--clr-yellow); 
            color: var(--clr-black); 
        }
        .container { 
            max-width: 700px; 
            margin: 3rem auto; 
            padding: 0 1rem; 
        }
        .card {
            background: var(--clr-white);
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            padding: 2.5rem;
            border-top: 6px solid var(--clr-blue);
        }
        h2 { 
            margin-top: 0; 
            color: var(--clr-blue); 
            border-bottom: 2px solid var(--clr-yellow); 
            padding-bottom: 0.5rem; 
            display: inline-block; 
        }
        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
            font-size: 1.1rem;
        }
        .profile-label { font-weight: 600; color: #555; }
        .profile-value { font-weight: bold; color: #222; }
        .badge {
            background: var(--clr-blue);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .actions-bar {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }
        .btn { 
            display: inline-block; 
            padding: 0.6rem 1.4rem; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s; 
        }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-secondary:hover { background: #7f8c8d; }
        .btn-warning { background: var(--clr-warning); color: white; }
        .btn-warning:hover { background: #d68910; }
        .btn-danger { background: var(--clr-danger); color: white; }
        .btn-danger:hover { background: #c0392b; }
    </style>
</head>
<body>
    <header>
        <h2>Alumni Network</h2>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/about">About Us</a>
        <a href="/users" class="active">Alumni System</a>
        <a href="/api/swagger">API Docs</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>🎓 Alumnus Profile Details</h2>
            <div style="margin-top: 1.5rem;">
                <div class="profile-row">
                    <span class="profile-label">Alumnus ID:</span>
                    <span class="profile-value"><span class="badge">#<!-- USER_ID --></span></span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">First Name:</span>
                    <span class="profile-value"><!-- USER_NAME --></span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">Last Name:</span>
                    <span class="profile-value"><!-- USER_SURNAME --></span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">Age:</span>
                    <span class="profile-value"><!-- USER_AGE --> years old</span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">Birthday:</span>
                    <span class="profile-value"><!-- USER_BIRTHDAY --></span>
                </div>
            </div>

            <div class="actions-bar">
                <a href="/users" class="btn btn-secondary">⬅️ Back to Directory</a>
                <a href="/users/<!-- USER_ID -->/edit" class="btn btn-warning">✏️ Edit Alumnus</a>
                <form action="/users/<!-- USER_ID -->/delete" method="POST" onsubmit="return confirm('Are you sure you want to delete this alumnus record?');" style="display:inline; margin: 0;">
                    <button type="submit" class="btn btn-danger">🗑️ Delete</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
