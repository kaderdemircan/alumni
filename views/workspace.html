<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><!-- TITLE --> | Alumni Network</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #182b24; background: #faf9f4; font: 16px/1.6 system-ui, sans-serif; }
        a { color: inherit; text-underline-offset: .2em; }
        main { max-width: 760px; margin: 4rem auto; padding: 0 1.25rem; }
        article { background: #fffefc; border: 1px solid #ebe8df; border-radius: 16px; padding: clamp(1.25rem, 5vw, 3rem); }
        h1 { font: 400 clamp(2.25rem, 7vw, 4rem)/1.1 Georgia, serif; margin: .5rem 0 1rem; }
        .role { display: inline-block; background: #fef08a; border-radius: 20px; padding: .15rem .8rem; font-size: .875rem; }
        li { margin: .6rem 0; }
        dt { font-weight: 650; }
        dd { margin: 0 0 .6rem; overflow-wrap: anywhere; }
    </style>
    <link rel="stylesheet" href="/nav.css">
</head>

    <!-- SITE_NAVIGATION -->

        <article>
            <span class="role"><!-- ROLE --></span>
            <h1><!-- TITLE --></h1>

            <!-- CONTENT -->
        </article>
    </main>

</html>
