<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Alumni Network</title>
    <style>
        :root {
            --clr-green: #2ecc71;
            --clr-yellow: #f1c40f;
            --clr-black: #111111;
            --clr-blue: #3498db;
            --clr-white: #ffffff;
            --clr-bg: #f8f9fa;
            --clr-danger: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--clr-bg);
            color: var(--clr-black);
        }
        header {
            background: var(--clr-black);
            color: var(--clr-white);
            padding: 1.5rem 0;
            text-align: center;
            border-bottom: 5px solid var(--clr-blue);
        }
        header h2 { margin: 0; font-size: 2rem; letter-spacing: 1px; }
        nav {
            background: var(--clr-blue);
            display: flex;
            justify-content: center;
            padding: 0.8rem;
        }
        nav a {
            color: var(--clr-white);
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            margin: 0 0.5rem;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        nav a:hover {
            background: var(--clr-yellow);
            color: var(--clr-black);
        }
        .error-container {
            max-width: 700px;
            margin: 4rem auto;
            padding: 3rem 2rem;
            text-align: center;
            background: var(--clr-white);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border-top: 6px solid var(--clr-danger);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: var(--clr-danger);
            margin: 0;
            line-height: 1;
            animation: shake 0.8s ease-in-out infinite alternate;
        }
        @keyframes shake {
            0% { transform: translateX(-2px); }
            100% { transform: translateX(2px); }
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-title {
            font-size: 1.8rem;
            color: var(--clr-black);
            margin: 0.5rem 0;
            font-weight: 700;
        }
        .error-reason {
            font-size: 1.1rem;
            color: #555;
            margin: 1.5rem 0;
            line-height: 1.6;
            padding: 1rem 1.5rem;
            background: #fdedec;
            border-left: 4px solid var(--clr-danger);
            border-radius: 4px;
            text-align: left;
        }
        .error-url {
            font-size: 0.9rem;
            color: #888;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
            background: var(--clr-bg);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            word-break: break-all;
        }
        .error-help {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
        }
        .error-actions {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--clr-blue);
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(52,152,219,0.3);
        }
        .btn-outline {
            background: transparent;
            color: var(--clr-blue);
            border: 2px solid var(--clr-blue);
        }
        .btn-outline:hover {
            background: var(--clr-blue);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <h2>Alumni Network</h2>
    </header>
    <nav>
        <a href="/">Home</a>
        <a href="/about">About Us</a>
        <a href="/users">Alumni System</a>
        <a href="/api/swagger">API Docs</a>
    </nav>

    <div class="error-container">
        <div class="error-icon">⚙️</div>
        <p class="error-code"><!-- ERROR_CODE --></p>
        <h1 class="error-title">Internal Server Error</h1>

        <div class="error-reason">
            <!-- ERROR_REASON -->
        </div>

        <div class="error-url">
            Requested URL: <!-- REQUESTED_URL -->
        </div>

        <div class="error-help">
            <p>Something went wrong on our end. Please try again later.</p>
            <p>If the problem persists, please contact the system administrator.</p>
        </div>

        <div class="error-actions">
            <a href="/" class="btn btn-primary">🏠 Back to Home</a>
            <a href="javascript:location.reload()" class="btn btn-outline">🔄 Try Again</a>
        </div>
    </div>
</body>
</html>
